name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TORCH_CPU: torch==2.14.0 torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cpu

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          pip install ${{ env.TORCH_CPU }}
          pip install -r requirements-dev.txt
      - name: ruff
        run: |
          ruff check --output-format=github .
          ruff format --check .
      - name: mypy
        run: mypy app

  test:
    name: Unit and API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/docclassifier_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          pip install ${{ env.TORCH_CPU }}
          pip install -r requirements-dev.txt
      - name: Unit and API tests
        run: python -m pytest -v tests
      - name: Golden-set replay
        if: hashFiles('app/classifier/models/classifier.pt') != ''
        run: python -m pytest -v app/classifier/eval/golden.py

  smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - name: Run smoke test
        run: ./scripts/smoke_test.sh 2>&1 | tee smoke.log
      - name: Report failure
        if: failure()
        run: |
          echo "::error title=smoke test failed::$(tail -c 1500 smoke.log | tr '\n' ' ')"
          docker compose ps -a
          docker compose logs --tail 80
      - name: Tear down
        if: always()
        run: docker compose down -v
