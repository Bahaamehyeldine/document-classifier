services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: docclassifier
      POSTGRES_PASSWORD: docclassifier_dev_pw
      POSTGRES_DB: docclassifier
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docclassifier"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: docclassifier
      MINIO_ROOT_PASSWORD: docclassifier_dev_pw
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  sftp:
    image: atmoz/sftp
    ports:
      - "${SFTP_PORT:-2222}:22"
    volumes:
      - sftpdata:/home/scanner/upload
    command: scanner:docclassifier_dev_pw:1001
    networks:
      - backend

  vault:
    image: hashicorp/vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "${VAULT_PORT:-8200}:8200"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8200/v1/sys/health?standbyok=true"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://docclassifier:docclassifier_dev_pw@db:5432/docclassifier
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

volumes:
  pgdata:
  miniodata:
  sftpdata:

networks:
  backend: