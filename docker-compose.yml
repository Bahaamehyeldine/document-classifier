# Local stack. Development credentials below are for these containers only;
# application code receives secrets exclusively from Vault (see vault-init).

x-app: &app
  build: .
  image: document-classifier:local
  environment: &app-env
    VAULT_ADDR: http://vault:8200
    VAULT_TOKEN: ${VAULT_ROOT_TOKEN}
    REDIS_URL: redis://redis:6379/0
    MINIO_ENDPOINT: minio:9000
    SFTP_HOST: sftp
  networks:
    - backend

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: docclassifier
      POSTGRES_PASSWORD: docclassifier_dev_pw
      POSTGRES_DB: docclassifier
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docclassifier"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  minio:
    # minio/minio is no longer published on Docker Hub; Chainguard's free build is maintained.
    # The image is distroless, so there is no container healthcheck.
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: docclassifier
      MINIO_ROOT_PASSWORD: docclassifier_dev_pw
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    networks:
      - backend

  sftp:
    image: atmoz/sftp
    ports:
      - "${SFTP_PORT:-2222}:22"
    volumes:
      - sftpdata:/home/scanner/upload
    # The upload folder is a mounted volume, so the image treats it as "already existing" and
    # leaves it root-owned, which makes every scanner write fail with "Permission denied".
    # Hand it to the scanner user (uid 1001, group users) before the image's entrypoint runs.
    entrypoint:
      - /bin/bash
      - -c
      - chown 1001:100 /home/scanner/upload && exec /entrypoint "$$@"
      - --
    command: scanner:docclassifier_dev_pw:1001
    networks:
      - backend

  vault:
    image: hashicorp/vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "${VAULT_PORT:-8200}:8200"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8200/v1/sys/health?standbyok=true"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # Seeds the dev secrets into Vault, then exits. Dev-mode Vault is in memory,
  # so this runs on every `docker compose up`; the JWT key is freshly random each time.
  vault-init:
    image: hashicorp/vault
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_ROOT_TOKEN}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        vault kv put secret/docclassifier
        database_url=postgresql+psycopg://docclassifier:docclassifier_dev_pw@db:5432/docclassifier
        jwt_secret="$$(head -c 48 /dev/urandom | base64 | tr -d '\n')"
        minio_access_key=docclassifier
        minio_secret_key=docclassifier_dev_pw
        sftp_password=docclassifier_dev_pw
    networks:
      - backend

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully

  api:
    <<: *app
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    <<: *app
    command: ["python", "-m", "app.workers.inference"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  sftp-ingest:
    <<: *app
    command: ["python", "-m", "app.workers.sftp_ingest"]
    environment:
      <<: *app-env
      SFTP_POLL_SECONDS: "2"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      sftp:
        condition: service_started

volumes:
  pgdata:
  miniodata:
  sftpdata:

networks:
  backend:
